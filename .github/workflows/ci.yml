name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - "master"
      - "ci"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.x"
    paths:
      - "**.py"
  pull_request:
    branches:
      - "master"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  UV_VERSION: "0.11.28"
  LINT_PYTHON_VERSION: '3.11'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linters-ruff:
    runs-on: ubuntu-22.04
    steps:
      - name: source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.LINT_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check async_customerio

      - name: Ruff format
        run: uv run ruff format --check async_customerio

  linters-mypy:
    runs-on: ubuntu-22.04
    steps:
      - name: source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.LINT_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Static type checker
        run: uv run --with types-setuptools mypy --install-types --no-error-summary --hide-error-codes --follow-imports=skip async_customerio

  test:
    needs: [ linters-ruff, linters-mypy ]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - name: source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest tests/

      - name: Submit coverage report
        if: github.ref == 'refs/heads/master'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_TOKEN }}
        run: |
          pip install codacy-coverage
          python-codacy-coverage -r coverage.xml
